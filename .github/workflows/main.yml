name: B-League Transfer Bot

on:
  schedule:
    - cron: '0 * * * *' # 毎時0分に実行
  workflow_dispatch: # GitHubの画面から手動で実行できるボタンを表示

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 実行後、通知履歴(txt)を上書き保存する権限

    steps:
    - name: リポジトリのコードを取得
      uses: actions/checkout@v4

    - name: Python環境の準備
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 必要なライブラリのインストール
      run: pip install requests beautifulsoup4

    - name: Botの実行
      env:
        # ここで金庫(Secrets)のURLを取り出し、環境変数として渡す
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python bleague_bot.py

    - name: 通知履歴（notified_urls.txt）の保存
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add notified_urls.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update notified_urls.txt" && git pull --rebase origin main && git push)

name: B-League Transfer Bot

on:
  schedule:
    # 💡 改善点1: 毎時「0分」は世界中のBotが集中して遅延するため、「11分」にずらします
    - cron: '3 * * * *' 
  workflow_dispatch: # 手動実行ボタン

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
    - name: リポジトリのコードを取得
      uses: actions/checkout@v4

    - name: Python環境の準備
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 必要なライブラリのインストール
      # 💡 注意: まだ現在のプログラムがBeautifulSoupを必要としているため残しています。
      # API版に完全移行した後は、ここを `pip install requests` だけにします！
      run: pip install requests beautifulsoup4

    - name: Botの実行
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python bleague_bot.py

    - name: 通知履歴（notified_urls.txt）の保存
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add notified_urls.txt
        
        # 💡 改善点2: Gitの保存処理をスッキリさせ、エラーによる停止を防ぎます
        if ! git diff --cached --quiet; then
          git commit -m "Update notified_urls.txt"
          git pull --rebase origin main
          git push origin main
        else
          echo "変更がないため、プッシュをスキップしました。"
        fi
